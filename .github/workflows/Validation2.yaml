name: CI-Test Validation
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  # JOB 1: Calidad de Código y Pruebas Unitarias
  unit-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Linting
        run: flake8 . --exclude=venv

      - name: Run Unit Tests
        run: pytest tests/ --ignore=tests/test_integration.py

  # JOB 2: Pruebas de Integración (Solo si el Job 1 pasa)
  integration-testing:
    runs-on: ubuntu-latest
    needs: unit-testing
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: uniticket_db
          POSTGRES_PASSWORD: password_seguro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install pytest psycopg2-binary
      
      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:password_seguro@localhost:5432/uniticket_db
        run: pytest tests/test_integration.py